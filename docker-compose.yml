services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: prabhu_qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Containerized backend - for later Linux/production deployment only.
  # Gated behind the "prod" profile so a plain `docker compose up` never
  # starts it; local dev runs the backend natively in .venv instead (see
  # README.md - GPU-in-container on Windows needs WSL2 + NVIDIA Container
  # Toolkit, real friction that buys nothing for local iteration).
  #
  # Start with: docker compose --profile prod up -d
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prabhu_backend
    profiles: ["prod"]
    env_file: .env
    environment:
      # Overrides the .env value: inside the Compose network the backend
      # reaches Qdrant via the service DNS name, not localhost - config-only
      # swap, no code change, same pattern as EMBED_MODEL/EMBED_DEVICE.
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped
